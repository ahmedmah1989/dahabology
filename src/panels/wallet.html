<section id="wallet">
<p class="x-lead">سجّل ذهبك واعرف قيمته ومكسبك كل يوم.</p>
<div class="x-hero sm" style="margin-top:16px"><div class="x-rays"></div><div class="x-ring" aria-live="polite"><span class="lbl">قيمة ذهبك الآن</span><b class="val fit" id="walNow">—</b><span class="chg" id="walDiff"></span></div></div>
<div class="x-pair"><div class="x-chip"><span>ما دفعته</span><b id="walPaid">—</b></div><div class="x-chip"><span>الوزن</span><b id="walWeight">—</b></div></div>
<p class="x-note" id="walGrams"></p>

<div id="walTable" hidden><div class="x-items" id="walRows"></div></div>
<p class="x-note" id="walEmpty">لم تضف أي قطعة بعد. أضف أول قطعة من هنا.</p>

<form class="x-card" id="walForm" style="margin-top:20px"><h2>أضف قطعة</h2>
<div class="x-karats" role="group" aria-label="اختر العيار" style="margin-top:14px">
<button type="button" class="x-karat" data-set="walKarat" data-value="21" aria-pressed="true"><span>عيار<b>21</b></span></button>
<button type="button" class="x-karat" data-set="walKarat" data-value="24" aria-pressed="false"><span>عيار<b>24</b></span></button>
<button type="button" class="x-karat" data-set="walKarat" data-value="18" aria-pressed="false"><span>عيار<b>18</b></span></button>
</div>
<select id="walKarat" hidden aria-hidden="true"><option value="21">21</option><option value="24">24</option><option value="18">18</option></select>
<div class="x-grid2">
<label class="x-field">الوزن بالجرام<input id="walGramsIn" inputmode="decimal" placeholder="8" autocomplete="off" required></label>
<label class="x-field">إجمالي ما دفعته<input id="walPaidIn" inputmode="decimal" placeholder="49500" autocomplete="off" required></label>
</div>
<label class="x-field sm">وصف (اختياري)<input id="walNoteIn" maxlength="40" placeholder="جنيه ذهب" autocomplete="off" style="direction:rtl"></label>
<div class="x-actions"><button type="submit" class="x-btn">أضف إلى دهبي</button></div><p class="x-msg" id="walMsg" role="status"></p></form>

<p class="x-note">القيمة بسعر شراء التاجر للجرام من آخر تحديث، والسعر الفعلي يحدده التاجر بعد فحص القطعة. المصنعية التي دفعتها لا تُسترد. البيانات محفوظة في متصفحك فقط ولا تُرسل لأي خادم.</p>
</section>
